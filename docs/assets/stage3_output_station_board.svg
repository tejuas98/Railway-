<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" width="200" height="150">
  <defs>
    <filter id="cidsShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="3" dy="3" stdDeviation="0" flood-color="#0F172A" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Clean Indian Railways Station CIDS Display Board -->
  <g transform="translate(15, 24)" filter="url(#cidsShadow)">
    <!-- Board Frame & Brackets -->
    <line x1="35" y1="0" x2="35" y2="12" stroke="#0F172A" stroke-width="3"/>
    <line x1="135" y1="0" x2="135" y2="12" stroke="#0F172A" stroke-width="3"/>
    
    <!-- Electronic Display Housing -->
    <rect x="0" y="12" width="170" height="88" rx="8" fill="#0B132B" stroke="#0F172A" stroke-width="3"/>

    <!-- Screen Bezel -->
    <rect x="6" y="18" width="158" height="76" rx="5" fill="#020617"/>

    <!-- Row 1: Train Name & Number -->
    <g transform="translate(14, 34)">
      <!-- Train Icon -->
      <rect x="0" y="-8" width="14" height="12" rx="2" fill="#38BDF8"/>
      <circle cx="3.5" cy="1" r="1.2" fill="#020617"/>
      <circle cx="10.5" cy="1" r="1.2" fill="#020617"/>
      <text x="20" y="0" font-size="9" font-weight="900" fill="#38BDF8" font-family="'Inter', monospace">12951 RAJDHANI EXP</text>
    </g>

    <!-- Row 2: Live Calibrated ETA & Status -->
    <g transform="translate(14, 58)">
      <text x="0" y="0" font-size="7" font-weight="700" fill="#94A3B8" font-family="'Inter', sans-serif">ARRIVING</text>
      <text x="0" y="18" font-size="16" font-weight="900" fill="#F8FAFC" font-family="'Inter', sans-serif">23:43</text>
      
      <!-- ON TIME Green Pill -->
      <rect x="60" y="3" width="46" height="16" rx="4" fill="#166534" stroke="#22C55E" stroke-width="1.2"/>
      <text x="83" y="14" font-size="7.5" font-weight="900" fill="#4ADE80" text-anchor="middle" font-family="'Inter', sans-serif">ON TIME</text>
    </g>

    <!-- Platform Indicator Box -->
    <g transform="translate(124, 46)">
      <rect x="0" y="0" width="34" height="38" rx="5" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
      <text x="17" y="12" font-size="6" font-weight="800" fill="#94A3B8" text-anchor="middle" font-family="'Inter', sans-serif">PLATFORM</text>
      <text x="17" y="30" font-size="16" font-weight="900" fill="#FDE047" text-anchor="middle" font-family="'Inter', sans-serif">4</text>
    </g>
  </g>

  <!-- Live Green Sync Indicator Lamp (Top Right) -->
  <g transform="translate(170, 18)">
    <circle cx="0" cy="0" r="7" fill="#22C55E" stroke="#0F172A" stroke-width="2"/>
    <circle cx="0" cy="0" r="12" fill="none" stroke="#22C55E" stroke-width="1.5" stroke-dasharray="3,3"/>
  </g>
</svg>
