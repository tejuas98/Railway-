<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" width="200" height="150">
  <!-- Subtle Broadcast Sync Rings (Radiating outward) -->
  <g opacity="0.6">
    <circle cx="100" cy="72" r="62" fill="none" stroke="#BAE6FD" stroke-width="2" stroke-dasharray="4,4"/>
    <circle cx="100" cy="72" r="76" fill="none" stroke="#E2E8F0" stroke-width="1.5" stroke-dasharray="3,3"/>
  </g>

  <!-- Outward Sync Signal Waves (Top Right & Left) -->
  <path d="M 148 42 Q 164 56 164 74 Q 164 92 148 106" fill="none" stroke="#10B981" stroke-width="3" stroke-linecap="round"/>
  <path d="M 158 32 Q 180 52 180 74 Q 180 96 158 116" fill="none" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>

  <path d="M 52 42 Q 36 56 36 74 Q 36 92 52 106" fill="none" stroke="#0284C7" stroke-width="3" stroke-linecap="round"/>
  <path d="M 42 32 Q 20 52 20 74 Q 20 96 42 116" fill="none" stroke="#0284C7" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>

  <!-- Modern Smartphone Body (Centered & Clean) -->
  <g transform="translate(64, 14)">
    <!-- Phone Shadow / Neubrutalist Depth -->
    <rect x="4" y="4" width="72" height="122" rx="16" fill="#0F172A"/>
    
    <!-- Phone Chassis Frame -->
    <rect x="0" y="0" width="72" height="122" rx="16" fill="#FFFFFF" stroke="#0F172A" stroke-width="3"/>
    
    <!-- Screen Area -->
    <rect x="4" y="6" width="64" height="110" rx="12" fill="#F8FAFC"/>

    <!-- Dynamic Island / Top Speaker Pill -->
    <rect x="23" y="10" width="26" height="5" rx="2.5" fill="#0F172A"/>

    <!-- App Header Indicator -->
    <circle cx="12" cy="22" r="2.5" fill="#0284C7"/>
    <rect x="18" y="20.5" width="22" height="3" rx="1.5" fill="#94A3B8"/>
    <circle cx="58" cy="22" r="2.5" fill="#10B981"/>

    <!-- Live Train Arrival Card -->
    <g transform="translate(8, 29)">
      <rect x="0" y="0" width="56" height="56" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>

      <!-- Train Front Icon Graphic -->
      <g transform="translate(18, 6)">
        <rect x="0" y="0" width="20" height="16" rx="4" fill="#0284C7" stroke="#0F172A" stroke-width="1.5"/>
        <rect x="3" y="3" width="14" height="6" rx="1" fill="#FFFFFF"/>
        <circle cx="4.5" cy="12" r="1.5" fill="#FDE047"/>
        <circle cx="15.5" cy="12" r="1.5" fill="#FDE047"/>
      </g>

      <!-- Big Bold Calibrated ETA -->
      <text x="28" y="34" font-size="11" font-weight="900" fill="#0F172A" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif">23:43</text>
      
      <!-- ON TIME Green Badge -->
      <rect x="8" y="38" width="40" height="13" rx="4" fill="#DCFCE7" stroke="#16A34A" stroke-width="1"/>
      <circle cx="14" cy="44.5" r="2" fill="#16A34A"/>
      <text x="27" y="47.5" font-size="6.5" font-weight="900" fill="#15803D" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif">ON TIME</text>
    </g>

    <!-- Platform Pill Badge -->
    <g transform="translate(8, 90)">
      <rect x="0" y="0" width="56" height="18" rx="5" fill="#0F172A"/>
      <text x="28" y="12.5" font-size="7.5" font-weight="800" fill="#FFFFFF" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif">PLATFORM 4</text>
    </g>

    <!-- Bottom Home Bar -->
    <rect x="24" y="112" width="24" height="2" rx="1" fill="#94A3B8"/>
  </g>
</svg>
