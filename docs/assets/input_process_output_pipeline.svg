        <circle cx="0" cy="0" r="9" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.5"/>
        <rect x="-3" y="-28" width="6" height="7" fill="#0284C7" stroke="#0F172A" stroke-width="1.5"/>
        <rect x="-3" y="21" width="6" height="7" fill="#0284C7" stroke="#0F172A" stroke-width="1.5"/>
        <rect x="-28" y="-3" width="7" height="6" fill="#0284C7" stroke="#0F172A" stroke-width="1.5"/>
        <rect x="21" y="-3" width="7" height="6" fill="#0284C7" stroke="#0F172A" stroke-width="1.5"/>
        <rect x="-3" y="-28" width="6" height="7" fill="#0284C7" stroke="#0F172A" stroke-width="1.5" transform="rotate(45)"/>
        <rect x="-3" y="-28" width="6" height="7" fill="#0284C7" stroke="#0F172A" stroke-width="1.5" transform="rotate(135)"/>
        <rect x="-3" y="-28" width="6" height="7" fill="#0284C7" stroke="#0F172A" stroke-width="1.5" transform="rotate(225)"/>
        <rect x="-3" y="-28" width="6" height="7" fill="#0284C7" stroke="#0F172A" stroke-width="1.5" transform="rotate(315)"/>
