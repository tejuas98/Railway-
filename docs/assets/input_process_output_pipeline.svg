        <text x="8" y="18" font-size="9.6" font-weight="700" fill="#0F172A">📍 PostGIS 1D Rail-Snap &amp; RK4</text>
        <rect x="157" y="5" width="50" height="18" rx="3" fill="#EDE9FE"/>
        <text x="182" y="17" font-size="7.8" font-weight="800" fill="#6D28D9" text-anchor="middle">Track LRS</text>
      </g>
      <!-- Pill 2 -->
