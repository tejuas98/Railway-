        <circle cx="0" cy="0" r="5" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.2"/>
        <rect x="-2.5" y="-19" width="5" height="5" fill="#F43F5E" stroke="#0F172A" stroke-width="1.2"/>
        <rect x="-2.5" y="14" width="5" height="5" fill="#F43F5E" stroke="#0F172A" stroke-width="1.2"/>
        <rect x="-19" y="-2.5" width="5" height="5" fill="#F43F5E" stroke="#0F172A" stroke-width="1.2"/>
        <rect x="14" y="-2.5" width="5" height="5" fill="#F43F5E" stroke="#0F172A" stroke-width="1.2"/>
