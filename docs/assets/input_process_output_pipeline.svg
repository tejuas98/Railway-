        <text x="70" y="21" font-size="8" font-weight="900" fill="#FFFFFF" text-anchor="middle">PF 4*</text>

        <!-- Signal Line Graphic -->
        <circle cx="16" cy="44" r="5" fill="#22C55E"/>
        <line x1="24" y1="44" x2="76" y2="44" stroke="#38BDF8" stroke-width="1.8"/>
        <text x="24" y="38" font-size="5.5" font-weight="800" fill="#94A3B8">4-ASPECT CLEAR</text>
      </g>

      <text x="52" y="122" font-size="8.5" font-weight="800" fill="#15803D" text-anchor="middle">Multi-Stakeholder Sync</text>
