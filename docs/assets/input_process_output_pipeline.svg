<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <!-- Soft card shadow -->
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="3" dy="3" stdDeviation="0" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- ==================================================== -->
  <!-- CARD 1: INPUT STAGE                                 -->
  <!-- ==================================================== -->
  <g transform="translate(20, 15)">
    <!-- Card Frame -->
    <rect x="0" y="0" width="345" height="230" rx="10" fill="#F8FAFC" stroke="#0F172A" stroke-width="2.5" filter="url(#cardShadow)"/>
    
    <!-- Top Header Banner -->
    <path d="M 0 10 Q 0 0 10 0 L 335 0 Q 345 0 345 10 L 345 32 L 0 32 Z" fill="#E2E8F0"/>
    <line x1="0" y1="32" x2="345" y2="32" stroke="#0F172A" stroke-width="2"/>
    <text x="172" y="21" font-size="12" font-weight="900" fill="#0F172A" text-anchor="middle" letter-spacing="0.5">INPUT STAGE</text>

    <!-- Left Visual Area: Satellite + Train -->
    <g transform="translate(10, 42)">
      <rect x="0" y="0" width="105" height="135" rx="6" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1.5"/>
      
      <!-- Satellite GSAT-15 -->
      <g transform="translate(52, 28)">
        <rect x="-8" y="-6" width="16" height="12" rx="2" fill="#F97316" stroke="#0F172A" stroke-width="1.5"/>
        <rect x="-24" y="-5" width="14" height="10" rx="1" fill="#38BDF8" stroke="#0F172A" stroke-width="1.2"/>
        <rect x="10" y="-5" width="14" height="10" rx="1" fill="#38BDF8" stroke="#0F172A" stroke-width="1.2"/>
        <circle cx="0" cy="0" r="2.5" fill="#FFFFFF"/>
        <!-- Radio beams -->
        <path d="M 0 8 L -22 45 M 0 8 L 22 45" stroke="#0284C7" stroke-width="1.5" stroke-dasharray="3,3"/>
      </g>

      <!-- Track -->
      <line x1="8" y1="96" x2="97" y2="96" stroke="#0F172A" stroke-width="2.5"/>
      <line x1="18" y1="96" x2="14" y2="102" stroke="#64748B" stroke-width="1.8"/>
      <line x1="38" y1="96" x2="34" y2="102" stroke="#64748B" stroke-width="1.8"/>
      <line x1="58" y1="96" x2="54" y2="102" stroke="#64748B" stroke-width="1.8"/>
      <line x1="78" y1="96" x2="74" y2="102" stroke="#64748B" stroke-width="1.8"/>

      <!-- Train Loco Engine -->
      <g transform="translate(26, 75)">
        <path d="M 0 0 L 52 0 Q 60 0 60 10 L 60 21 L 0 21 Z" fill="#DC2626" stroke="#0F172A" stroke-width="1.8"/>
        <rect x="0" y="10" width="60" height="3" fill="#FFFFFF"/>
        <polygon points="40,3 52,3 50,9 40,9" fill="#38BDF8" stroke="#0F172A" stroke-width="1.2"/>
        <circle cx="12" cy="21" r="4" fill="#334155" stroke="#0F172A" stroke-width="1.5"/>
        <circle cx="28" cy="21" r="4" fill="#334155" stroke="#0F172A" stroke-width="1.5"/>
        <circle cx="48" cy="21" r="4" fill="#334155" stroke="#0F172A" stroke-width="1.5"/>
      </g>

      <text x="52" y="122" font-size="8.5" font-weight="800" fill="#0369A1" text-anchor="middle">NavIC 30s Telemetry</text>
    </g>

    <!-- Right Stacked Sub-Pills -->
    <g transform="translate(124, 42)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="210" height="28" rx="5" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
        <text x="8" y="18" font-size="10" font-weight="700" fill="#0F172A">🛰️ BEL RTIS NavIC (GSAT-15)</text>
        <rect x="156" y="5" width="46" height="18" rx="3" fill="#E0F2FE"/>
        <text x="179" y="17" font-size="8" font-weight="800" fill="#0369A1" text-anchor="middle">30s GPS</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(0, 36)">
        <rect x="0" y="0" width="210" height="28" rx="5" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
        <text x="8" y="18" font-size="10" font-weight="700" fill="#0F172A">📋 CRIS COA &amp; FOIS Feeds</text>
        <rect x="146" y="5" width="56" height="18" rx="3" fill="#E0F2FE"/>
        <text x="174" y="17" font-size="8" font-weight="800" fill="#0369A1" text-anchor="middle">Block State</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(0, 72)">
        <rect x="0" y="0" width="210" height="28" rx="5" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
        <text x="8" y="18" font-size="10" font-weight="700" fill="#0F172A">⚠️ e-Caution Orders (TSR)</text>
        <rect x="142" y="5" width="60" height="18" rx="3" fill="#FEF3C7"/>
        <text x="172" y="17" font-size="8" font-weight="800" fill="#B45309" text-anchor="middle">Speed Limits</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(0, 108)">
        <rect x="0" y="0" width="210" height="28" rx="5" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
        <text x="8" y="18" font-size="10" font-weight="700" fill="#0F172A">🌤️ Open-Meteo Satellite</text>
        <rect x="150" y="5" width="52" height="18" rx="3" fill="#E0F2FE"/>
        <text x="176" y="17" font-size="8" font-weight="800" fill="#0369A1" text-anchor="middle">Fog / Rain</text>
      </g>
    </g>

    <!-- Bottom Caption -->
    <line x1="10" y1="192" x2="335" y2="192" stroke="#E2E8F0" stroke-width="1.2"/>
    <text x="172" y="212" font-size="9" font-weight="700" fill="#64748B" text-anchor="middle">
      Statutory Multi-Source Ingestion • 100% Zero New Hardware
    </text>
  </g>

  <!-- ==================================================== -->
  <!-- CONNECTING ARROW 1                                   -->
  <!-- ==================================================== -->
  <g transform="translate(378, 116)">
    <path d="M 0 0 L 26 0 M 16 -8 L 26 0 L 16 8" fill="none" stroke="#0F172A" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

