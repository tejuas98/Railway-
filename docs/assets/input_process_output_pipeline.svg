      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="210" height="28" rx="5" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
        <text x="8" y="18" font-size="9.6" font-weight="700" fill="#0F172A">📱 Passenger: Calibrated ETA</text>
