        <rect x="0" y="0" width="215" height="28" rx="5" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
        <text x="8" y="18" font-size="9.6" font-weight="700" fill="#0F172A">🧠 PyG ST-GAT Corridor Graph</text>
        <rect x="148" y="5" width="59" height="18" rx="3" fill="#EDE9FE"/>
        <text x="177" y="17" font-size="7.8" font-weight="800" fill="#6D28D9" text-anchor="middle">Attention AI</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(0, 108)">
        <rect x="0" y="0" width="215" height="28" rx="5" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
        <text x="8" y="18" font-size="9.6" font-weight="700" fill="#0F172A">🎯 Conformal Uncertainty [P10-P90]</text>
        <rect x="162" y="5" width="45" height="18" rx="3" fill="#EDE9FE"/>
        <text x="184" y="17" font-size="7.8" font-weight="800" fill="#6D28D9" text-anchor="middle">Certified</text>
      </g>
    </g>

