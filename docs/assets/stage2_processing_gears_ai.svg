<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" width="200" height="150">
  <defs>
    <filter id="gearShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="2" stdDeviation="0" flood-color="#0F172A" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background Glow & Connection Grid -->
  <g opacity="0.4">
    <circle cx="75" cy="78" r="48" fill="none" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4,4"/>
    <circle cx="135" cy="100" r="32" fill="none" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4,4"/>
  </g>

  <!-- Neural Network Connections & Nodes -->
  <g>
    <!-- Connection lines -->
    <line x1="75" y1="78" x2="140" y2="40" stroke="#7C3AED" stroke-width="2.5" stroke-dasharray="3,3"/>
    <line x1="75" y1="78" x2="165" y2="70" stroke="#7C3AED" stroke-width="2" stroke-dasharray="3,3"/>
    <line x1="140" y1="40" x2="165" y2="70" stroke="#7C3AED" stroke-width="2"/>
    <line x1="40" y1="35" x2="75" y2="78" stroke="#0284C7" stroke-width="2" stroke-dasharray="3,3"/>

    <!-- Neural Node 1 (Top Right Purple) -->
    <circle cx="140" cy="40" r="14" fill="#7C3AED" stroke="#0F172A" stroke-width="2.5"/>
    <circle cx="140" cy="40" r="5" fill="#FFFFFF"/>
    
    <!-- Neural Node 2 (Far Right Indigo) -->
    <circle cx="165" cy="70" r="10" fill="#6366F1" stroke="#0F172A" stroke-width="2"/>
    <circle cx="165" cy="70" r="3.5" fill="#FFFFFF"/>

    <!-- Neural Node 3 (Top Left Cyan) -->
    <circle cx="40" cy="35" r="9" fill="#06B6D4" stroke="#0F172A" stroke-width="2"/>
    <circle cx="40" cy="35" r="3" fill="#FFFFFF"/>
  </g>

  <!-- Large Primary Gear (Deep Cyan / Sky Blue) -->
  <g transform="translate(75, 78)">
    <!-- Gear Body -->
    <circle cx="0" cy="0" r="36" fill="#0284C7" stroke="#0F172A" stroke-width="3"/>
    <circle cx="0" cy="0" r="15" fill="#FFFFFF" stroke="#0F172A" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="5" fill="#0F172A"/>
    
    <!-- 8 Gear Teeth -->
    <!-- 0 deg (Top) -->
    <rect x="-6" y="-45" width="12" height="11" rx="2" fill="#0284C7" stroke="#0F172A" stroke-width="2.5"/>
    <!-- 180 deg (Bottom) -->
    <rect x="-6" y="34" width="12" height="11" rx="2" fill="#0284C7" stroke="#0F172A" stroke-width="2.5"/>
    <!-- 270 deg (Left) -->
    <rect x="-45" y="-6" width="11" height="12" rx="2" fill="#0284C7" stroke="#0F172A" stroke-width="2.5"/>
    <!-- 90 deg (Right) -->
    <rect x="34" y="-6" width="11" height="12" rx="2" fill="#0284C7" stroke="#0F172A" stroke-width="2.5"/>
    
    <!-- 45 deg -->
    <rect x="-6" y="-45" width="12" height="11" rx="2" fill="#0284C7" stroke="#0F172A" stroke-width="2.5" transform="rotate(45)"/>
    <!-- 135 deg -->
    <rect x="-6" y="-45" width="12" height="11" rx="2" fill="#0284C7" stroke="#0F172A" stroke-width="2.5" transform="rotate(135)"/>
    <!-- 225 deg -->
    <rect x="-6" y="-45" width="12" height="11" rx="2" fill="#0284C7" stroke="#0F172A" stroke-width="2.5" transform="rotate(225)"/>
    <!-- 315 deg -->
    <rect x="-6" y="-45" width="12" height="11" rx="2" fill="#0284C7" stroke="#0F172A" stroke-width="2.5" transform="rotate(315)"/>
  </g>

  <!-- Interlocking Medium Gear (Coral / Rose Red) -->
  <g transform="translate(135, 102)">
    <!-- Gear Body -->
    <circle cx="0" cy="0" r="24" fill="#F43F5E" stroke="#0F172A" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="9" fill="#FFFFFF" stroke="#0F172A" stroke-width="2"/>
    <circle cx="0" cy="0" r="3" fill="#0F172A"/>

    <!-- 6 Gear Teeth -->
    <rect x="-4.5" y="-31" width="9" height="8" rx="1.5" fill="#F43F5E" stroke="#0F172A" stroke-width="2"/>
    <rect x="-4.5" y="23" width="9" height="8" rx="1.5" fill="#F43F5E" stroke="#0F172A" stroke-width="2"/>
    <rect x="-4.5" y="-31" width="9" height="8" rx="1.5" fill="#F43F5E" stroke="#0F172A" stroke-width="2" transform="rotate(60)"/>
    <rect x="-4.5" y="-31" width="9" height="8" rx="1.5" fill="#F43F5E" stroke="#0F172A" stroke-width="2" transform="rotate(120)"/>
    <rect x="-4.5" y="-31" width="9" height="8" rx="1.5" fill="#F43F5E" stroke="#0F172A" stroke-width="2" transform="rotate(240)"/>
    <rect x="-4.5" y="-31" width="9" height="8" rx="1.5" fill="#F43F5E" stroke="#0F172A" stroke-width="2" transform="rotate(300)"/>
  </g>

  <!-- Small Amber Gear (Accent) -->
  <g transform="translate(32, 105)">
    <circle cx="0" cy="0" r="16" fill="#F59E0B" stroke="#0F172A" stroke-width="2"/>
    <circle cx="0" cy="0" r="6" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.5"/>
    <rect x="-3" y="-21" width="6" height="6" rx="1" fill="#F59E0B" stroke="#0F172A" stroke-width="1.5"/>
    <rect x="-3" y="15" width="6" height="6" rx="1" fill="#F59E0B" stroke="#0F172A" stroke-width="1.5"/>
    <rect x="-21" y="-3" width="6" height="6" rx="1" fill="#F59E0B" stroke="#0F172A" stroke-width="1.5"/>
    <rect x="15" y="-3" width="6" height="6" rx="1" fill="#F59E0B" stroke="#0F172A" stroke-width="1.5"/>
  </g>
</svg>
