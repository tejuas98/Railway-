<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" width="200" height="150">
  <defs>
    <filter id="monitorShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="2" stdDeviation="0" flood-color="#0F172A" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- 4-Aspect Railway Signal Post (Right Side) -->
  <g transform="translate(162, 20)">
    <!-- Signal Mast / Post -->
    <line x1="12" y1="40" x2="12" y2="120" stroke="#0F172A" stroke-width="4"/>
    <line x1="6" y1="120" x2="18" y2="120" stroke="#0F172A" stroke-width="5"/>
    <!-- Ladder Rungs -->
    <line x1="7" y1="65" x2="17" y2="65" stroke="#64748B" stroke-width="2"/>
    <line x1="7" y1="85" x2="17" y2="85" stroke="#64748B" stroke-width="2"/>
    <line x1="7" y1="105" x2="17" y2="105" stroke="#64748B" stroke-width="2"/>
    
    <!-- Signal Head Housing -->
    <rect x="0" y="0" width="24" height="52" rx="6" fill="#0F172A" stroke="#0F172A" stroke-width="2"/>
    
    <!-- 4 Aspects (Lenses) -->
    <!-- Green Aspect (Lit - Proceed) -->
    <circle cx="12" cy="10" r="4.5" fill="#22C55E" stroke="#15803D" stroke-width="1.5"/>
    <!-- Yellow 1 Aspect (Unlit) -->
    <circle cx="12" cy="21" r="4" fill="#334155" stroke="#1E293B" stroke-width="1"/>
    <!-- Red Aspect (Unlit) -->
    <circle cx="12" cy="32" r="4" fill="#334155" stroke="#1E293B" stroke-width="1"/>
    <!-- Yellow 2 Aspect (Unlit) -->
    <circle cx="12" cy="43" r="4" fill="#334155" stroke="#1E293B" stroke-width="1"/>
    <!-- Glow Ring on Green -->
    <circle cx="12" cy="10" r="7" fill="none" stroke="#22C55E" stroke-width="1.5" stroke-dasharray="2,2"/>
  </g>

  <!-- Workstation Cockpit / Monitor (Center-Left) -->
  <g transform="translate(18, 16)">
    <!-- Monitor Stand -->
    <polygon points="62,96 78,96 82,116 58,116" fill="#475569" stroke="#0F172A" stroke-width="2.5"/>
    <rect x="42" y="116" width="56" height="8" rx="2" fill="#0F172A"/>

    <!-- Monitor Bezel / Frame -->
    <rect x="6" y="6" width="128" height="90" rx="8" fill="#0B132B" stroke="#0F172A" stroke-width="3"/>
    
    <!-- Screen Glass -->
    <rect x="12" y="12" width="116" height="78" rx="4" fill="#0F172A"/>

    <!-- UI Header Bar -->
    <rect x="16" y="16" width="108" height="14" rx="2" fill="#1E293B"/>
    <circle cx="23" cy="23" r="2.5" fill="#EF4444"/>
    <circle cx="31" cy="23" r="2.5" fill="#F59E0B"/>
    <circle cx="39" cy="23" r="2.5" fill="#10B981"/>
    <text x="47" y="26" font-size="6.5" font-weight="800" fill="#94A3B8" font-family="'Inter', -apple-system, sans-serif">GATI-SETU COCKPIT</text>

    <!-- Live ETA Display Badge -->
    <rect x="16" y="34" width="70" height="26" rx="3" fill="#1E293B" stroke="#0284C7" stroke-width="1.5"/>
    <text x="21" y="45" font-size="6" font-weight="700" fill="#94A3B8" font-family="'Inter', -apple-system, sans-serif">CALIBRATED ETA</text>
    <text x="21" y="56" font-size="11" font-weight="900" fill="#38BDF8" font-family="'Inter', -apple-system, sans-serif">23:43</text>
    <text x="54" y="56" font-size="7" font-weight="700" fill="#22C55E" font-family="'Inter', -apple-system, sans-serif">ON TIME</text>

    <!-- Platform Pill -->
    <rect x="90" y="34" width="34" height="26" rx="3" fill="#166534" stroke="#22C55E" stroke-width="1.5"/>
    <text x="107" y="44" font-size="6" font-weight="700" fill="#DCFCE7" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif">PLATFORM</text>
    <text x="107" y="56" font-size="10" font-weight="900" fill="#FFFFFF" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif">PF 4*</text>

    <!-- Mini Radar / Signal Status Wave Line -->
    <g transform="translate(16, 64)">
      <rect x="0" y="0" width="108" height="22" rx="3" fill="#1E293B"/>
      <!-- Track line -->
      <line x1="6" y1="11" x2="102" y2="11" stroke="#334155" stroke-width="2"/>
      <!-- Live pulse indicator -->
      <line x1="6" y1="11" x2="68" y2="11" stroke="#38BDF8" stroke-width="2.5"/>
      <circle cx="68" cy="11" r="4" fill="#22C55E" stroke="#FFFFFF" stroke-width="1.5"/>
      <!-- Text label -->
      <text x="10" y="8" font-size="5" font-weight="700" fill="#64748B" font-family="'Inter', -apple-system, sans-serif">SECTION 104-B OCCUPIED</text>
      <text x="76" y="8" font-size="5" font-weight="800" fill="#22C55E" font-family="'Inter', -apple-system, sans-serif">CLEAR TO PROCEED</text>
    </g>
  </g>
</svg>
