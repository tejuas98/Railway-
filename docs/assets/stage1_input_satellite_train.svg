<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" width="200" height="150">
  <!-- ISRO GSAT-15 Satellite -->
  <g transform="translate(100, 30)">
    <!-- Main Body -->
    <rect x="-14" y="-12" width="28" height="24" rx="3" fill="#F97316" stroke="#0F172A" stroke-width="2.5"/>
    <!-- Solar Panels -->
    <rect x="-48" y="-9" width="30" height="18" rx="2" fill="#38BDF8" stroke="#0F172A" stroke-width="2"/>
    <line x1="-33" y1="-9" x2="-33" y2="9" stroke="#0F172A" stroke-width="1.5"/>
    <rect x="18" y="-9" width="30" height="18" rx="2" fill="#38BDF8" stroke="#0F172A" stroke-width="2"/>
    <line x1="33" y1="-9" x2="33" y2="9" stroke="#0F172A" stroke-width="1.5"/>
    <!-- Antenna Core -->
    <circle cx="0" cy="0" r="4.5" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.5"/>
    <!-- NavIC Radio Beam Signals -->
    <path d="M -8 16 L -42 85" stroke="#0284C7" stroke-width="2.5" stroke-dasharray="4,4"/>
    <path d="M 0 16 L 0 85" stroke="#0284C7" stroke-width="2.5" stroke-dasharray="4,4"/>
    <path d="M 8 16 L 42 85" stroke="#0284C7" stroke-width="2.5" stroke-dasharray="4,4"/>
  </g>

  <!-- Ground & Railway Track -->
  <line x1="10" y1="124" x2="190" y2="124" stroke="#0F172A" stroke-width="3.5"/>
  <!-- Track Sleepers -->
  <line x1="20" y1="124" x2="14" y2="132" stroke="#64748B" stroke-width="2.5"/>
  <line x1="45" y1="124" x2="39" y2="132" stroke="#64748B" stroke-width="2.5"/>
  <line x1="70" y1="124" x2="64" y2="132" stroke="#64748B" stroke-width="2.5"/>
  <line x1="95" y1="124" x2="89" y2="132" stroke="#64748B" stroke-width="2.5"/>
  <line x1="120" y1="124" x2="114" y2="132" stroke="#64748B" stroke-width="2.5"/>
  <line x1="145" y1="124" x2="139" y2="132" stroke="#64748B" stroke-width="2.5"/>
  <line x1="170" y1="124" x2="164" y2="132" stroke="#64748B" stroke-width="2.5"/>

  <!-- WAP-7 Locomotive -->
  <g transform="translate(50, 88)">
    <!-- Cab Body -->
    <path d="M 0 0 L 80 0 Q 95 0 95 16 L 95 32 L 0 32 Z" fill="#DC2626" stroke="#0F172A" stroke-width="2.5"/>
    <!-- White Stripe -->
    <rect x="0" y="16" width="95" height="5" fill="#FFFFFF"/>
    <!-- Cab Window -->
    <polygon points="65,5 86,5 82,14 65,14" fill="#38BDF8" stroke="#0F172A" stroke-width="2"/>
    <!-- Headlight -->
    <circle cx="92" cy="20" r="3" fill="#FDE047" stroke="#0F172A" stroke-width="1.5"/>
    <!-- Pantograph -->
    <path d="M 25 0 L 38 -12 L 52 0" fill="none" stroke="#0F172A" stroke-width="2.5"/>
    <line x1="30" y1="-12" x2="46" y2="-12" stroke="#0F172A" stroke-width="3"/>
    <!-- Wheels -->
    <circle cx="20" cy="32" r="6" fill="#334155" stroke="#0F172A" stroke-width="2.5"/>
    <circle cx="45" cy="32" r="6" fill="#334155" stroke="#0F172A" stroke-width="2.5"/>
    <circle cx="75" cy="32" r="6" fill="#334155" stroke="#0F172A" stroke-width="2.5"/>
  </g>
</svg>
