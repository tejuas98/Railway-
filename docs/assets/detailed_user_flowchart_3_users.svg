<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <!-- Card Drop Shadow -->
    <filter id="boxShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="2" dy="2.5" stdDeviation="0" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
    <filter id="masterShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="3" dy="3.5" stdDeviation="0" flood-color="#0F172A" flood-opacity="0.15"/>
    </filter>

    <!-- Arrow Marker -->
    <marker id="arrowDown" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M 1 1 L 4 7 L 7 1 Z" fill="#0F172A"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="1400" height="900" fill="#FFFFFF"/>
  <!-- Top Header Banner Tint -->
  <rect x="0" y="0" width="1400" height="10" fill="#0284C7"/>

  <!-- ======================================================== -->
  <!-- TOP MASTER NODE: UNIFIED GATI-SETU INGESTION             -->
  <!-- ======================================================== -->
  <g transform="translate(340, 22)" filter="url(#masterShadow)">
    <rect x="0" y="0" width="720" height="66" rx="10" fill="#E0F2FE" stroke="#0284C7" stroke-width="2.5"/>
    <text x="360" y="27" font-size="14" font-weight="900" fill="#0369A1" text-anchor="middle" letter-spacing="0.5">
      🚆 GATI-SETU Unified Multi-Stakeholder Railway Operating Engine
    </text>
    <text x="360" y="48" font-size="10.5" font-weight="700" fill="#0F172A" text-anchor="middle">
      Statutory Ingestion: BEL RTIS NavIC • CRIS COA/FOIS • e-Caution (TSR) • Route Topology &amp; Gradients • Open-Meteo
    </text>
  </g>

  <!-- ======================================================== -->
  <!-- TOP BRANCHING CONNECTORS (Master to 3 Columns)           -->
  <!-- ======================================================== -->
  <line x1="700" y1="88" x2="700" y2="112" stroke="#0F172A" stroke-width="3"/>
  <line x1="240" y1="112" x2="1160" y2="112" stroke="#0F172A" stroke-width="3"/>
  
  <line x1="240" y1="112" x2="240" y2="132" stroke="#0F172A" stroke-width="3" marker-end="url(#arrowDown)"/>
  <line x1="700" y1="112" x2="700" y2="132" stroke="#0F172A" stroke-width="3" marker-end="url(#arrowDown)"/>
  <line x1="1160" y1="112" x2="1160" y2="132" stroke="#0F172A" stroke-width="3" marker-end="url(#arrowDown)"/>

  <!-- ======================================================== -->
  <!-- COLUMN 1: PASSENGER JOURNEY FLOW (LEFT)                  -->
  <!-- ======================================================== -->
  <!-- Header Pill: Passenger -->
  <g transform="translate(130, 136)">
    <rect x="0" y="0" width="220" height="36" rx="18" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
    <text x="110" y="23" font-size="13" font-weight="900" fill="#B45309" text-anchor="middle">
      📱 1. Passenger Journey Flow
    </text>
  </g>

  <line x1="240" y1="172" x2="240" y2="194" stroke="#0F172A" stroke-width="2.5" marker-end="url(#arrowDown)"/>

  <!-- Row 1 (Step 1.1): App Launch & Smart Search -->
  <g transform="translate(70, 194)" filter="url(#boxShadow)">
    <rect x="0" y="0" width="340" height="52" rx="8" fill="#FEF9C3" stroke="#0F172A" stroke-width="2"/>
    <text x="170" y="31" font-size="12.5" font-weight="800" fill="#0F172A" text-anchor="middle">📱 App Launch &amp; Smart Train Search</text>
  </g>

  <line x1="240" y1="246" x2="240" y2="268" stroke="#0F172A" stroke-width="2.5" marker-end="url(#arrowDown)"/>

  <!-- Row 2 (Step 1.2): 1D Track Position -->
  <g transform="translate(70, 268)" filter="url(#boxShadow)">
    <rect x="0" y="0" width="340" height="52" rx="8" fill="#FFEDD5" stroke="#0F172A" stroke-width="2"/>
    <text x="170" y="31" font-size="12.5" font-weight="800" fill="#0F172A" text-anchor="middle">🛰️ Live 1D Track Position [PostGIS LRS]</text>
  </g>

  <line x1="240" y1="320" x2="240" y2="342" stroke="#0F172A" stroke-width="2.5" marker-end="url(#arrowDown)"/>

  <!-- Row 3 (Step 1.3): Calibrated Dynamic ETA -->
  <g transform="translate(70, 342)" filter="url(#boxShadow)">
    <rect x="0" y="0" width="340" height="52" rx="8" fill="#FEE2E2" stroke="#0F172A" stroke-width="2"/>
    <text x="170" y="31" font-size="12.5" font-weight="800" fill="#0F172A" text-anchor="middle">⏱️ Calibrated Dynamic ETA [ST-GAT AI]</text>
  </g>

  <line x1="240" y1="394" x2="240" y2="416" stroke="#0F172A" stroke-width="2.5" marker-end="url(#arrowDown)"/>

  <!-- Row 4 (Step 1.4): HERO DECISION NODE (With Description!) -->
  <g transform="translate(70, 416)" filter="url(#boxShadow)">
    <rect x="0" y="0" width="340" height="72" rx="8" fill="#FAF5FF" stroke="#7C3AED" stroke-width="2.5"/>
    <text x="170" y="28" font-size="12.5" font-weight="900" fill="#6D28D9" text-anchor="middle">🎯 Connection at Risk? [Decision]</text>
    <text x="170" y="52" font-size="10.5" font-weight="700" fill="#0F172A" text-anchor="middle">[Yes: Alt train re-route • No: [P10–P90] safe band]</text>
  </g>

  <line x1="240" y1="488" x2="240" y2="510" stroke="#0F172A" stroke-width="2.5" marker-end="url(#arrowDown)"/>

  <!-- Row 5 (Step 1.5): Coach Radar & Platform Walk -->
  <g transform="translate(70, 510)" filter="url(#boxShadow)">
    <rect x="0" y="0" width="340" height="52" rx="8" fill="#E0E7FF" stroke="#0F172A" stroke-width="2"/>
    <text x="170" y="31" font-size="12.5" font-weight="800" fill="#0F172A" text-anchor="middle">🧭 Coach Radar &amp; Platform Walking Guide</text>
  </g>

  <line x1="240" y1="562" x2="240" y2="584" stroke="#0F172A" stroke-width="2.5" marker-end="url(#arrowDown)"/>

  <!-- Row 6 (Step 1.6): Feeder Cab Sync -->
  <g transform="translate(70, 584)" filter="url(#boxShadow)">
    <rect x="0" y="0" width="340" height="52" rx="8" fill="#DCFCE7" stroke="#0F172A" stroke-width="2"/>
    <text x="170" y="31" font-size="12.5" font-weight="800" fill="#15803D" text-anchor="middle">🚗 1-Tap Feeder Cab &amp; Metro Sync</text>
  </g>


  <!-- ======================================================== -->
  <!-- COLUMN 2: SECTION CONTROLLER COCKPIT FLOW (CENTER)       -->
  <!-- ======================================================== -->
  <!-- Header Pill: Controller -->
  <g transform="translate(580, 136)">
    <rect x="0" y="0" width="240" height="36" rx="18" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
    <text x="120" y="23" font-size="13" font-weight="900" fill="#15803D" text-anchor="middle">
      🚦 2. Section Controller Cockpit
    </text>
  </g>

  <line x1="700" y1="172" x2="700" y2="194" stroke="#0F172A" stroke-width="2.5" marker-end="url(#arrowDown)"/>

  <!-- Row 1 (Step 2.1): Controller Cockpit Launch -->
  <g transform="translate(530, 194)" filter="url(#boxShadow)">
    <rect x="0" y="0" width="340" height="52" rx="8" fill="#F0FDF4" stroke="#0F172A" stroke-width="2"/>
    <text x="170" y="31" font-size="12.5" font-weight="800" fill="#0F172A" text-anchor="middle">💻 Controller Cockpit Corridor Lock</text>
  </g>

  <line x1="700" y1="246" x2="700" y2="268" stroke="#0F172A" stroke-width="2.5" marker-end="url(#arrowDown)"/>

  <!-- Row 2 (Step 2.2): Multi-Train Stringline Chart -->
  <g transform="translate(530, 268)" filter="url(#boxShadow)">
    <rect x="0" y="0" width="340" height="52" rx="8" fill="#DCFCE7" stroke="#0F172A" stroke-width="2"/>
    <text x="170" y="31" font-size="12.5" font-weight="800" fill="#0F172A" text-anchor="middle">🗺️ Multi-Train Stringline Dispatch Chart</text>
  </g>

  <line x1="700" y1="320" x2="700" y2="342" stroke="#0F172A" stroke-width="2.5" marker-end="url(#arrowDown)"/>

  <!-- Row 3 (Step 2.3): AI Precedence & Headway -->
  <g transform="translate(530, 342)" filter="url(#boxShadow)">
    <rect x="0" y="0" width="340" height="52" rx="8" fill="#EDE9FE" stroke="#0F172A" stroke-width="2"/>
    <text x="170" y="31" font-size="12.5" font-weight="800" fill="#0F172A" text-anchor="middle">⚡ Dynamic Precedence &amp; AI Simulation</text>
  </g>

  <line x1="700" y1="394" x2="700" y2="416" stroke="#0F172A" stroke-width="2.5" marker-end="url(#arrowDown)"/>

  <!-- Row 4 (Step 2.4): HERO DECISION NODE (With Description!) -->
  <g transform="translate(530, 416)" filter="url(#boxShadow)">
    <rect x="0" y="0" width="340" height="72" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="2.5"/>
    <text x="170" y="28" font-size="12.5" font-weight="900" fill="#B45309" text-anchor="middle">⚠️ Section Bottleneck Ahead? [Decision]</text>
    <text x="170" y="52" font-size="10.5" font-weight="700" fill="#0F172A" text-anchor="middle">[Yes: Rule 401 Loop Siding • No: Green corridor lock]</text>
  </g>

  <line x1="700" y1="488" x2="700" y2="510" stroke="#0F172A" stroke-width="2.5" marker-end="url(#arrowDown)"/>

  <!-- Row 5 (Step 2.5): TSR Speed Order Broadcast -->
  <g transform="translate(530, 510)" filter="url(#boxShadow)">
    <rect x="0" y="0" width="340" height="52" rx="8" fill="#E0F2FE" stroke="#0F172A" stroke-width="2"/>
    <text x="170" y="31" font-size="12.5" font-weight="800" fill="#0F172A" text-anchor="middle">📡 Auto-Broadcast TSR / Speed Order</text>
  </g>

  <line x1="700" y1="562" x2="700" y2="584" stroke="#0F172A" stroke-width="2.5" marker-end="url(#arrowDown)"/>

  <!-- Row 6 (Step 2.6): Throughput Restored -->
  <g transform="translate(530, 584)" filter="url(#boxShadow)">
    <rect x="0" y="0" width="340" height="52" rx="8" fill="#DCFCE7" stroke="#0F172A" stroke-width="2"/>
    <text x="170" y="31" font-size="12.5" font-weight="800" fill="#15803D" text-anchor="middle">🟢 Section Throughput Restored (+18%)</text>
  </g>


  <!-- ======================================================== -->
  <!-- COLUMN 3: STATION MASTER & STAFF FLOW (RIGHT)            -->
  <!-- ======================================================== -->
  <!-- Header Pill: Station Master -->
  <g transform="translate(1040, 136)">
    <rect x="0" y="0" width="240" height="36" rx="18" fill="#F3E8FF" stroke="#7C3AED" stroke-width="2"/>
    <text x="120" y="23" font-size="13" font-weight="900" fill="#6D28D9" text-anchor="middle">
      🚉 3. Station Master &amp; Staff Flow
    </text>
  </g>

  <line x1="1160" y1="172" x2="1160" y2="194" stroke="#0F172A" stroke-width="2.5" marker-end="url(#arrowDown)"/>

  <!-- Row 1 (Step 3.1): Station Terminal Login -->
  <g transform="translate(990, 194)" filter="url(#boxShadow)">
    <rect x="0" y="0" width="340" height="52" rx="8" fill="#FAF5FF" stroke="#0F172A" stroke-width="2"/>
    <text x="170" y="31" font-size="12.5" font-weight="800" fill="#0F172A" text-anchor="middle">🖥️ Station Master Terminal Login</text>
  </g>

  <line x1="1160" y1="246" x2="1160" y2="268" stroke="#0F172A" stroke-width="2.5" marker-end="url(#arrowDown)"/>

  <!-- Row 2 (Step 3.2): Automated CIDS LED & Audio Sync -->
  <g transform="translate(990, 268)" filter="url(#boxShadow)">
    <rect x="0" y="0" width="340" height="52" rx="8" fill="#E0F2FE" stroke="#0F172A" stroke-width="2"/>
    <text x="170" y="31" font-size="12.5" font-weight="800" fill="#0F172A" text-anchor="middle">📢 Automated CIDS LED &amp; Audio Sync</text>
  </g>

  <line x1="1160" y1="320" x2="1160" y2="342" stroke="#0F172A" stroke-width="2.5" marker-end="url(#arrowDown)"/>

  <!-- Row 3 (Step 3.3): Turnaround Crew & Cleaning -->
  <g transform="translate(990, 342)" filter="url(#boxShadow)">
    <rect x="0" y="0" width="340" height="52" rx="8" fill="#FEF9C3" stroke="#0F172A" stroke-width="2"/>
    <text x="170" y="31" font-size="12.5" font-weight="800" fill="#0F172A" text-anchor="middle">🧹 Turnaround Crew &amp; Cleaning Dispatch</text>
  </g>

  <line x1="1160" y1="394" x2="1160" y2="416" stroke="#0F172A" stroke-width="2.5" marker-end="url(#arrowDown)"/>

  <!-- Row 4 (Step 3.4): HERO DECISION NODE (With Description!) -->
  <g transform="translate(990, 416)" filter="url(#boxShadow)">
    <rect x="0" y="0" width="340" height="72" rx="8" fill="#F3E8FF" stroke="#7C3AED" stroke-width="2.5"/>
    <text x="170" y="28" font-size="12.5" font-weight="900" fill="#6D28D9" text-anchor="middle">🚉 Platform Conflict Ahead? [Decision]</text>
    <text x="170" y="52" font-size="10.5" font-weight="700" fill="#0F172A" text-anchor="middle">[Yes: Dynamic PF 4 reassign • No: Normal berth]</text>
  </g>

  <line x1="1160" y1="488" x2="1160" y2="510" stroke="#0F172A" stroke-width="2.5" marker-end="url(#arrowDown)"/>

  <!-- Row 5 (Step 3.5): Logistics & Parcel Van Scheduling -->
  <g transform="translate(990, 510)" filter="url(#boxShadow)">
    <rect x="0" y="0" width="340" height="52" rx="8" fill="#EDE9FE" stroke="#0F172A" stroke-width="2"/>
    <text x="170" y="31" font-size="12.5" font-weight="800" fill="#0F172A" text-anchor="middle">📦 Logistics &amp; Parcel Van Scheduling</text>
  </g>

  <line x1="1160" y1="562" x2="1160" y2="584" stroke="#0F172A" stroke-width="2.5" marker-end="url(#arrowDown)"/>

  <!-- Row 6 (Step 3.6): Seamless Station Turnaround -->
  <g transform="translate(990, 584)" filter="url(#boxShadow)">
    <rect x="0" y="0" width="340" height="52" rx="8" fill="#DCFCE7" stroke="#0F172A" stroke-width="2"/>
    <text x="170" y="31" font-size="12.5" font-weight="800" fill="#15803D" text-anchor="middle">🏁 Seamless Station Turnaround</text>
  </g>


  <!-- ======================================================== -->
  <!-- BOTTOM CONVERGENCE (All 3 Flows Converge into Master)    -->
  <!-- ======================================================== -->
  <line x1="240" y1="636" x2="240" y2="686" stroke="#0F172A" stroke-width="3"/>
  <line x1="700" y1="636" x2="700" y2="686" stroke="#0F172A" stroke-width="3"/>
  <line x1="1160" y1="636" x2="1160" y2="686" stroke="#0F172A" stroke-width="3"/>

  <!-- Horizontal meeting bar -->
  <line x1="240" y1="686" x2="1160" y2="686" stroke="#0F172A" stroke-width="3"/>

  <!-- Center arrow to bottom node -->
  <line x1="700" y1="686" x2="700" y2="720" stroke="#0F172A" stroke-width="3" marker-end="url(#arrowDown)"/>

  <!-- Bottom Master Node: Converged Operations -->
  <g transform="translate(340, 725)" filter="url(#masterShadow)">
    <rect x="0" y="0" width="720" height="76" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="2.5"/>
    <text x="360" y="32" font-size="14.5" font-weight="900" fill="#15803D" text-anchor="middle" letter-spacing="0.5">
      ✅ Converged Real-Time Operations: Single Source of Ground Truth
    </text>
    <text x="360" y="54" font-size="11" font-weight="700" fill="#0F172A" text-anchor="middle">
      Zero Cascading Delays • Multi-Stakeholder Trust • High Network Punctuality &amp; Safety
    </text>
  </g>

</svg>
