<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <!-- Card Drop Shadow -->
    <filter id="boxShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="2" dy="2.5" stdDeviation="0" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
    <filter id="masterShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="3" dy="3.5" stdDeviation="0" flood-color="#0F172A" flood-opacity="0.15"/>
    </filter>

    <!-- Arrow Marker -->
    <marker id="arrowDown" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M 1 1 L 4 7 L 7 1 Z" fill="#0F172A"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="1400" height="900" fill="#FFFFFF"/>
  <!-- Subtle Header Banner Tint -->
  <rect x="0" y="0" width="1400" height="10" fill="#0284C7"/>

  <!-- ======================================================== -->
  <!-- TOP MASTER NODE: UNIFIED GATI-SETU INGESTION             -->
  <!-- ======================================================== -->
  <g transform="translate(360, 20)" filter="url(#masterShadow)">
    <rect x="0" y="0" width="680" height="66" rx="10" fill="#E0F2FE" stroke="#0284C7" stroke-width="2.5"/>
    <text x="340" y="27" font-size="14" font-weight="900" fill="#0369A1" text-anchor="middle" letter-spacing="0.5">
      🚆 GATI-SETU Unified Multi-Stakeholder Railway Operating Engine
    </text>
    <text x="340" y="48" font-size="11" font-weight="700" fill="#0F172A" text-anchor="middle">
      Statutory Multi-Source Ingestion: BEL RTIS NavIC (GSAT-15) • CRIS COA/FOIS • e-Caution (TSR) • Open-Meteo
    </text>
  </g>

  <!-- ======================================================== -->
  <!-- TOP BRANCHING CONNECTORS (Master to 3 Columns)           -->
  <!-- ======================================================== -->
  <!-- Center drop from master node -->
  <line x1="700" y1="86" x2="700" y2="108" stroke="#0F172A" stroke-width="3"/>
  <!-- Horizontal splitter bar -->
  <line x1="240" y1="108" x2="1160" y2="108" stroke="#0F172A" stroke-width="3"/>
  
  <!-- Left Drop Arrow to Passenger Column -->
  <line x1="240" y1="108" x2="240" y2="128" stroke="#0F172A" stroke-width="3" marker-end="url(#arrowDown)"/>
  <!-- Center Drop Arrow to Controller Column -->
  <line x1="700" y1="108" x2="700" y2="128" stroke="#0F172A" stroke-width="3" marker-end="url(#arrowDown)"/>
  <!-- Right Drop Arrow to Station Master Column -->
  <line x1="1160" y1="108" x2="1160" y2="128" stroke="#0F172A" stroke-width="3" marker-end="url(#arrowDown)"/>

  <!-- ======================================================== -->
  <!-- COLUMN 1: PASSENGER JOURNEY FLOW (LEFT)                  -->
  <!-- ======================================================== -->
  <!-- Header Pill: Passenger -->
  <g transform="translate(130, 134)">
    <rect x="0" y="0" width="220" height="34" rx="17" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
    <text x="110" y="22" font-size="12.5" font-weight="900" fill="#B45309" text-anchor="middle">
      📱 1. Passenger Journey Flow
    </text>
  </g>

  <!-- Arrow down from Header Pill -->
  <line x1="240" y1="168" x2="240" y2="182" stroke="#0F172A" stroke-width="2.5" marker-end="url(#arrowDown)"/>

  <!-- Step 1.1: Open App -->
  <g transform="translate(70, 184)" filter="url(#boxShadow)">
    <rect x="0" y="0" width="340" height="62" rx="8" fill="#FEF9C3" stroke="#0F172A" stroke-width="2"/>
    <text x="170" y="24" font-size="12" font-weight="900" fill="#0F172A" text-anchor="middle">📱 Passenger Opens GATI-SETU</text>
    <text x="170" y="44" font-size="10" font-weight="600" fill="#475569" text-anchor="middle">Offline-first PWA / React Native • Auto-detects GPS geofence</text>
  </g>

  <line x1="240" y1="246" x2="240" y2="258" stroke="#0F172A" stroke-width="2.5" marker-end="url(#arrowDown)"/>

  <!-- Step 1.2: Search Train -->
  <g transform="translate(70, 260)" filter="url(#boxShadow)">
    <rect x="0" y="0" width="340" height="62" rx="8" fill="#FEF3C7" stroke="#0F172A" stroke-width="2"/>
    <text x="170" y="24" font-size="12" font-weight="900" fill="#0F172A" text-anchor="middle">🔍 Search Train # or Nearest Station</text>
    <text x="170" y="44" font-size="10" font-weight="600" fill="#475569" text-anchor="middle">Live autocomplete for 12,000+ trains (e.g. #12301 Rajdhani)</text>
  </g>

  <line x1="240" y1="322" x2="240" y2="334" stroke="#0F172A" stroke-width="2.5" marker-end="url(#arrowDown)"/>

  <!-- Step 1.3: Track Position -->
  <g transform="translate(70, 336)" filter="url(#boxShadow)">
    <rect x="0" y="0" width="340" height="62" rx="8" fill="#FFEDD5" stroke="#0F172A" stroke-width="2"/>
    <text x="170" y="24" font-size="12" font-weight="900" fill="#0F172A" text-anchor="middle">🛰️ Live 1D Track Position Display</text>
    <text x="170" y="44" font-size="10" font-weight="600" fill="#475569" text-anchor="middle">PostGIS LRS chainage KM • Zero map drift • Tunnel RK4 fallback</text>
  </g>

  <line x1="240" y1="398" x2="240" y2="410" stroke="#0F172A" stroke-width="2.5" marker-end="url(#arrowDown)"/>

  <!-- Step 1.4: Dynamic ETA -->
  <g transform="translate(70, 412)" filter="url(#boxShadow)">
    <rect x="0" y="0" width="340" height="62" rx="8" fill="#FEE2E2" stroke="#0F172A" stroke-width="2"/>
    <text x="170" y="24" font-size="12" font-weight="900" fill="#0F172A" text-anchor="middle">⏱️ Calibrated Dynamic ETA View</text>
    <text x="170" y="44" font-size="10" font-weight="600" fill="#475569" text-anchor="middle">Physics ODE + ST-GAT AI • Adapts to ground speed limits &amp; fog</text>
  </g>

  <line x1="240" y1="474" x2="240" y2="486" stroke="#0F172A" stroke-width="2.5" marker-end="url(#arrowDown)"/>

  <!-- Step 1.5: Conformal Range -->
  <g transform="translate(70, 488)" filter="url(#boxShadow)">
    <rect x="0" y="0" width="340" height="62" rx="8" fill="#F3E8FF" stroke="#0F172A" stroke-width="2"/>
    <text x="170" y="24" font-size="12" font-weight="900" fill="#0F172A" text-anchor="middle">🎯 Conformal Uncertainty Interval</text>
    <text x="170" y="44" font-size="10" font-weight="600" fill="#475569" text-anchor="middle">Displays [P10 • P50 • P90] arrival window • 90% certified coverage</text>
  </g>

  <line x1="240" y1="550" x2="240" y2="562" stroke="#0F172A" stroke-width="2.5" marker-end="url(#arrowDown)"/>

  <!-- Step 1.6: Coach Radar -->
  <g transform="translate(70, 564)" filter="url(#boxShadow)">
    <rect x="0" y="0" width="340" height="62" rx="8" fill="#E0E7FF" stroke="#0F172A" stroke-width="2"/>
    <text x="170" y="24" font-size="12" font-weight="900" fill="#0F172A" text-anchor="middle">🧭 Coach Radar &amp; Platform Walking Guide</text>
    <text x="170" y="44" font-size="10" font-weight="600" fill="#475569" text-anchor="middle">Exact rake layout (e.g. B4/A1) • Walking path to assigned platform</text>
  </g>

  <line x1="240" y1="626" x2="240" y2="638" stroke="#0F172A" stroke-width="2.5" marker-end="url(#arrowDown)"/>

  <!-- Step 1.7: Feeder Cab Sync -->
  <g transform="translate(70, 640)" filter="url(#boxShadow)">
    <rect x="0" y="0" width="340" height="62" rx="8" fill="#DCFCE7" stroke="#0F172A" stroke-width="2"/>
    <text x="170" y="24" font-size="12" font-weight="900" fill="#15803D" text-anchor="middle">🚗 1-Tap Feeder Cab &amp; Metro Sync</text>
    <text x="170" y="44" font-size="10" font-weight="600" fill="#475569" text-anchor="middle">Pre-timed Uber/Ola pickup at destination • Zero waiting time</text>
  </g>


  <!-- ======================================================== -->
  <!-- COLUMN 2: SECTION CONTROLLER COCKPIT FLOW (CENTER)       -->
  <!-- ======================================================== -->
  <!-- Header Pill: Controller -->
  <g transform="translate(580, 134)">
    <rect x="0" y="0" width="240" height="34" rx="17" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
    <text x="120" y="22" font-size="12.5" font-weight="900" fill="#15803D" text-anchor="middle">
      🚦 2. Section Controller Cockpit
    </text>
  </g>

  <!-- Arrow down from Header Pill -->
  <line x1="700" y1="168" x2="700" y2="182" stroke="#0F172A" stroke-width="2.5" marker-end="url(#arrowDown)"/>

  <!-- Step 2.1: Launch Cockpit -->
  <g transform="translate(530, 184)" filter="url(#boxShadow)">
    <rect x="0" y="0" width="340" height="62" rx="8" fill="#F0FDF4" stroke="#0F172A" stroke-width="2"/>
    <text x="170" y="24" font-size="12" font-weight="900" fill="#0F172A" text-anchor="middle">💻 Controller Launches Cockpit</text>
    <text x="170" y="44" font-size="10" font-weight="600" fill="#475569" text-anchor="middle">FastAPI WebSockets dashboard • Real-time 130 km/h corridor lock</text>
  </g>

  <line x1="700" y1="246" x2="700" y2="258" stroke="#0F172A" stroke-width="2.5" marker-end="url(#arrowDown)"/>

  <!-- Step 2.2: Stringline Chart -->
  <g transform="translate(530, 260)" filter="url(#boxShadow)">
    <rect x="0" y="0" width="340" height="62" rx="8" fill="#DCFCE7" stroke="#0F172A" stroke-width="2"/>
    <text x="170" y="24" font-size="12" font-weight="900" fill="#0F172A" text-anchor="middle">🗺️ Multi-Train Stringline Chart</text>
    <text x="170" y="44" font-size="10" font-weight="600" fill="#475569" text-anchor="middle">Time-distance space diagram • Automatic block section occupancy</text>
  </g>

  <line x1="700" y1="322" x2="700" y2="334" stroke="#0F172A" stroke-width="2.5" marker-end="url(#arrowDown)"/>

  <!-- Step 2.3: Conflict Alert -->
  <g transform="translate(530, 336)" filter="url(#boxShadow)">
    <rect x="0" y="0" width="340" height="62" rx="8" fill="#FEF3C7" stroke="#0F172A" stroke-width="2"/>
    <text x="170" y="24" font-size="12" font-weight="900" fill="#0F172A" text-anchor="middle">⚠️ Bottleneck &amp; Conflict Detection</text>
    <text x="170" y="44" font-size="10" font-weight="600" fill="#475569" text-anchor="middle">Graph AI predicts delays ahead • Flags preceding freight clashes</text>
  </g>

  <line x1="700" y1="398" x2="700" y2="410" stroke="#0F172A" stroke-width="2.5" marker-end="url(#arrowDown)"/>

  <!-- Step 2.4: AI Priority -->
  <g transform="translate(530, 412)" filter="url(#boxShadow)">
    <rect x="0" y="0" width="340" height="62" rx="8" fill="#EDE9FE" stroke="#0F172A" stroke-width="2"/>
    <text x="170" y="24" font-size="12" font-weight="900" fill="#0F172A" text-anchor="middle">⚡ AI Precedence Scoring</text>
    <text x="170" y="44" font-size="10" font-weight="600" fill="#475569" text-anchor="middle">Dynamic priority: Rajdhani / Vande Bharat vs Freight dispatch</text>
  </g>

  <line x1="700" y1="474" x2="700" y2="486" stroke="#0F172A" stroke-width="2.5" marker-end="url(#arrowDown)"/>

  <!-- Step 2.5: Rule 401 Siding -->
  <g transform="translate(530, 488)" filter="url(#boxShadow)">
    <rect x="0" y="0" width="340" height="62" rx="8" fill="#FCE7F3" stroke="#0F172A" stroke-width="2"/>
    <text x="170" y="24" font-size="12" font-weight="900" fill="#0F172A" text-anchor="middle">🔁 Rule 401 Loop Siding Decision</text>
    <text x="170" y="44" font-size="10" font-weight="600" fill="#475569" text-anchor="middle">1-click siding diversion • Recovers +22 mins corridor headway</text>
  </g>

  <line x1="700" y1="550" x2="700" y2="562" stroke="#0F172A" stroke-width="2.5" marker-end="url(#arrowDown)"/>

  <!-- Step 2.6: TSR Caution Push -->
  <g transform="translate(530, 564)" filter="url(#boxShadow)">
    <rect x="0" y="0" width="340" height="62" rx="8" fill="#E0F2FE" stroke="#0F172A" stroke-width="2"/>
    <text x="170" y="24" font-size="12" font-weight="900" fill="#0F172A" text-anchor="middle">📡 Auto-Broadcast TSR / Speed Order</text>
    <text x="170" y="44" font-size="10" font-weight="600" fill="#475569" text-anchor="middle">Direct digital push to loco cab display &amp; automatic track signals</text>
  </g>

  <line x1="700" y1="626" x2="700" y2="638" stroke="#0F172A" stroke-width="2.5" marker-end="url(#arrowDown)"/>

  <!-- Step 2.7: Throughput Optimized -->
  <g transform="translate(530, 640)" filter="url(#boxShadow)">
    <rect x="0" y="0" width="340" height="62" rx="8" fill="#DCFCE7" stroke="#0F172A" stroke-width="2"/>
    <text x="170" y="24" font-size="12" font-weight="900" fill="#15803D" text-anchor="middle">🟢 Section Throughput Optimized</text>
    <text x="170" y="44" font-size="10" font-weight="600" fill="#475569" text-anchor="middle">Zero cascading deadlock • +18% corridor capacity utilization</text>
  </g>


  <!-- ======================================================== -->
  <!-- COLUMN 3: STATION MASTER & STAFF FLOW (RIGHT)            -->
  <!-- ======================================================== -->
  <!-- Header Pill: Station Master -->
  <g transform="translate(1040, 134)">
    <rect x="0" y="0" width="240" height="34" rx="17" fill="#F3E8FF" stroke="#7C3AED" stroke-width="2"/>
    <text x="120" y="22" font-size="12.5" font-weight="900" fill="#6D28D9" text-anchor="middle">
      🚉 3. Station Master &amp; Staff Flow
    </text>
  </g>

  <!-- Arrow down from Header Pill -->
  <line x1="1160" y1="168" x2="1160" y2="182" stroke="#0F172A" stroke-width="2.5" marker-end="url(#arrowDown)"/>

  <!-- Step 3.1: Station Master Login -->
  <g transform="translate(990, 184)" filter="url(#boxShadow)">
    <rect x="0" y="0" width="340" height="62" rx="8" fill="#FAF5FF" stroke="#0F172A" stroke-width="2"/>
    <text x="170" y="24" font-size="12" font-weight="900" fill="#0F172A" text-anchor="middle">🖥️ Station Master Terminal Login</text>
    <text x="170" y="44" font-size="10" font-weight="600" fill="#475569" text-anchor="middle">Station intranet dashboard • 60-min lookahead arrival queue</text>
  </g>

  <line x1="1160" y1="246" x2="1160" y2="258" stroke="#0F172A" stroke-width="2.5" marker-end="url(#arrowDown)"/>

  <!-- Step 3.2: Dynamic Platform Allocation -->
  <g transform="translate(990, 260)" filter="url(#boxShadow)">
    <rect x="0" y="0" width="340" height="62" rx="8" fill="#F3E8FF" stroke="#0F172A" stroke-width="2"/>
    <text x="170" y="24" font-size="12" font-weight="900" fill="#0F172A" text-anchor="middle">🚉 Dynamic Platform Allocation</text>
    <text x="170" y="44" font-size="10" font-weight="600" fill="#475569" text-anchor="middle">Conflict-free assignment (PF 4) avoiding track crossover clash</text>
  </g>

  <line x1="1160" y1="322" x2="1160" y2="334" stroke="#0F172A" stroke-width="2.5" marker-end="url(#arrowDown)"/>

  <!-- Step 3.3: CIDS LED & Audio Sync -->
  <g transform="translate(990, 336)" filter="url(#boxShadow)">
    <rect x="0" y="0" width="340" height="62" rx="8" fill="#E0F2FE" stroke="#0F172A" stroke-width="2"/>
    <text x="170" y="24" font-size="12" font-weight="900" fill="#0F172A" text-anchor="middle">📢 Automated CIDS LED &amp; Audio Sync</text>
    <text x="170" y="44" font-size="10" font-weight="600" fill="#475569" text-anchor="middle">Instant bilingual automated TTS PA &amp; platform LED guidance</text>
  </g>

  <line x1="1160" y1="398" x2="1160" y2="410" stroke="#0F172A" stroke-width="2.5" marker-end="url(#arrowDown)"/>

  <!-- Step 3.4: Turnaround Crew -->
  <g transform="translate(990, 412)" filter="url(#boxShadow)">
    <rect x="0" y="0" width="340" height="62" rx="8" fill="#FEF9C3" stroke="#0F172A" stroke-width="2"/>
    <text x="170" y="24" font-size="12" font-weight="900" fill="#0F172A" text-anchor="middle">🧹 Turnaround Crew Dispatch</text>
    <text x="170" y="44" font-size="10" font-weight="600" fill="#475569" text-anchor="middle">Cleaning, watering &amp; linen teams alerted based on exact ETA</text>
  </g>

  <line x1="1160" y1="474" x2="1160" y2="486" stroke="#0F172A" stroke-width="2.5" marker-end="url(#arrowDown)"/>

  <!-- Step 3.5: Crew Lobby -->
  <g transform="translate(990, 488)" filter="url(#boxShadow)">
    <rect x="0" y="0" width="340" height="62" rx="8" fill="#FFEDD5" stroke="#0F172A" stroke-width="2"/>
    <text x="170" y="24" font-size="12" font-weight="900" fill="#0F172A" text-anchor="middle">👨‍✈️ Driver &amp; Guard Crew Lobby Sync</text>
    <text x="170" y="44" font-size="10" font-weight="600" fill="#475569" text-anchor="middle">Loco pilot rest &amp; handover scheduled • Eliminates crew idle wait</text>
  </g>

  <line x1="1160" y1="550" x2="1160" y2="562" stroke="#0F172A" stroke-width="2.5" marker-end="url(#arrowDown)"/>

  <!-- Step 3.6: Logistics & Parcel -->
  <g transform="translate(990, 564)" filter="url(#boxShadow)">
    <rect x="0" y="0" width="340" height="62" rx="8" fill="#EDE9FE" stroke="#0F172A" stroke-width="2"/>
    <text x="170" y="24" font-size="12" font-weight="900" fill="#0F172A" text-anchor="middle">📦 Logistics &amp; Parcel Van Scheduling</text>
    <text x="170" y="44" font-size="10" font-weight="600" fill="#475569" text-anchor="middle">Downstream cargo docks &amp; postal mail vans alerted with precision</text>
  </g>

  <line x1="1160" y1="626" x2="1160" y2="638" stroke="#0F172A" stroke-width="2.5" marker-end="url(#arrowDown)"/>

  <!-- Step 3.7: Turnaround Complete -->
  <g transform="translate(990, 640)" filter="url(#boxShadow)">
    <rect x="0" y="0" width="340" height="62" rx="8" fill="#DCFCE7" stroke="#0F172A" stroke-width="2"/>
    <text x="170" y="24" font-size="12" font-weight="900" fill="#15803D" text-anchor="middle">🏁 Seamless Station Turnaround</text>
    <text x="170" y="44" font-size="10" font-weight="600" fill="#475569" text-anchor="middle">Zero platform deadlock • Rapid boarding &amp; punctuality restored</text>
  </g>


  <!-- ======================================================== -->
  <!-- BOTTOM CONVERGENCE (All 3 Flows Converge into Master)    -->
  <!-- ======================================================== -->
  <!-- Lines down from each column -->
  <line x1="240" y1="702" x2="240" y2="736" stroke="#0F172A" stroke-width="3"/>
  <line x1="700" y1="702" x2="700" y2="736" stroke="#0F172A" stroke-width="3"/>
  <line x1="1160" y1="702" x2="1160" y2="736" stroke="#0F172A" stroke-width="3"/>

  <!-- Horizontal meeting bar -->
  <line x1="240" y1="736" x2="1160" y2="736" stroke="#0F172A" stroke-width="3"/>

  <!-- Center arrow to bottom node -->
  <line x1="700" y1="736" x2="700" y2="765" stroke="#0F172A" stroke-width="3" marker-end="url(#arrowDown)"/>

  <!-- Bottom Master Node: Converged Operations -->
  <g transform="translate(340, 770)" filter="url(#masterShadow)">
    <rect x="0" y="0" width="720" height="74" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="2.5"/>
    <text x="360" y="30" font-size="14.5" font-weight="900" fill="#15803D" text-anchor="middle" letter-spacing="0.5">
      ✅ Converged Real-Time Operations: Single Source of Ground Truth
    </text>
    <text x="360" y="52" font-size="11" font-weight="700" fill="#0F172A" text-anchor="middle">
      Zero Cascading Delays • Multi-Stakeholder Trust • High Network Punctuality &amp; Safety
    </text>
  </g>

</svg>
